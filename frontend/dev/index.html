<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Populife panel (dev)</title>
    <!-- ha-icon stand-in: Material Design Icons by name, like Home Assistant's <ha-icon>. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
    />
    <style>
      body {
        margin: 0;
        font-family: Roboto, system-ui, sans-serif;
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --text-primary-color: #fff;
        --primary-background-color: #fafafa;
        --secondary-background-color: #e5e5e5;
        --card-background-color: #fff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --error-color: #db4437;
        --success-color: #43a047;
        --warning-color: #ffa600;
        --app-header-background-color: #03a9f4;
        --app-header-text-color: #fff;
      }
      body.dark {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --primary-background-color: #111111;
        --secondary-background-color: #282828;
        --card-background-color: #1c1c1c;
        --divider-color: rgba(225, 225, 225, 0.12);
        --app-header-background-color: #101e24;
      }
      .controls {
        position: fixed;
        right: 8px;
        bottom: 8px;
        z-index: 10;
        display: flex;
        gap: 6px;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label><input type="checkbox" id="dark" /> dark</label>
      <label><input type="checkbox" id="ru" /> ru</label>
      <label><input type="checkbox" id="narrow" /> narrow</label>
      <label><input type="checkbox" id="denied" /> no access</label>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
