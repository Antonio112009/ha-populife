name: Release

# Trunk-based: every merge into main that carries a new manifest version is published as a
# GitHub release with the populife.zip HACS installs. Merges that keep the version (docs,
# CI, dev dependencies) publish nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/populife/manifest.json"))["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to publish."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build populife.zip
        if: steps.existing.outputs.released == 'false'
        working-directory: custom_components/populife
        run: zip -r "$GITHUB_WORKSPACE/populife.zip" . -x '__pycache__/*'

      - name: Publish release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" populife.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest
