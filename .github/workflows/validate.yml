name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch breakage from new Home Assistant / HACS rules between commits.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration
          # Drop once the icon is merged into home-assistant/brands.
          ignore: brands
