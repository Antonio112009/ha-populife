version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Home Assistant decides these versions. They change when
    # pytest-homeassistant-custom-component moves to a new Home Assistant release, and
    # scripts/check_ha_pins.py fails CI until pyproject.toml matches that release again.
    ignore:
      - dependency-name: aiousbwatcher
      - dependency-name: serialx
      - dependency-name: bleak
      - dependency-name: bleak-retry-connector
      - dependency-name: bluetooth-adapters
      - dependency-name: bluetooth-auto-recovery
      - dependency-name: dbus-fast
      - dependency-name: habluetooth
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pre-commit"]
